spring:
  application:
    name: springbootDev-test

  # 测试环境使用 H2 内存数据库，避免依赖真实 MySQL
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 0

# 启用 Aegis DB Engine 的自动初始化，在测试环境下自动同步内存表结构
db:
  init:
    enabled: true
    init-data: true

# 启用系统配置初始化
sys:
  config:
    init:
      enabled: true

# 测试环境下文件上传的基础配置
file:
  active: ${FILE_STORAGE_ACTIVE:LOCAL}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    bucket-name: ${MINIO_BUCKET_NAME:dev-bucket}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123}
    auto-create-bucket: true
    domain: ${MINIO_DOMAIN:}

